<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaultLine — Error Dashboard</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --text: #e4e4e7; --muted: #71717a; --accent: #f97316;
      --red: #ef4444; --yellow: #eab308; --green: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }

    header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border);
             display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.5rem; }
    header h1 span { color: var(--accent); }
    .connect { display: flex; gap: .5rem; }
    .connect input { background: var(--surface); border: 1px solid var(--border);
                     color: var(--text); padding: .5rem .75rem; border-radius: 6px;
                     width: 350px; font-size: .875rem; }
    .connect button { background: var(--accent); color: #fff; border: none;
                      padding: .5rem 1rem; border-radius: 6px; cursor: pointer;
                      font-weight: 600; font-size: .875rem; }
    .connect button:hover { opacity: .9; }

    .stats { display: flex; gap: 1rem; padding: 1.5rem 2rem; }
    .stat { background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 1rem 1.5rem; flex: 1; }
    .stat .label { font-size: .75rem; color: var(--muted); text-transform: uppercase;
                   letter-spacing: .05em; }
    .stat .value { font-size: 1.75rem; font-weight: 700; margin-top: .25rem; }

    main { padding: 0 2rem 2rem; }
    h2 { font-size: 1.125rem; margin-bottom: 1rem; }

    .error-list { display: flex; flex-direction: column; gap: .5rem; }
    .error-card { background: var(--surface); border: 1px solid var(--border);
                  border-radius: 8px; padding: 1rem 1.25rem; cursor: pointer;
                  transition: border-color .15s; display: flex; align-items: flex-start;
                  gap: 1rem; }
    .error-card:hover { border-color: var(--accent); }
    .error-count { background: var(--red); color: #fff; border-radius: 6px;
                   min-width: 3rem; text-align: center; padding: .25rem .5rem;
                   font-weight: 700; font-size: .875rem; flex-shrink: 0; }
    .error-count.warn { background: var(--yellow); color: #000; }
    .error-count.low  { background: var(--border); color: var(--text); }
    .error-info { flex: 1; min-width: 0; }
    .error-msg { font-family: 'SF Mono', 'Fira Code', monospace; font-size: .875rem;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .error-meta { font-size: .75rem; color: var(--muted); margin-top: .35rem;
                  display: flex; gap: 1rem; }

    .detail-panel { background: var(--surface); border: 1px solid var(--border);
                    border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
    .detail-panel h3 { margin-bottom: .75rem; }
    .detail-panel .field { margin-bottom: .5rem; font-size: .875rem; }
    .detail-panel .field .k { color: var(--muted); min-width: 100px; display: inline-block; }
    .occ-list { margin-top: 1rem; }
    .occ { font-family: monospace; font-size: .8rem; padding: .5rem;
           border-bottom: 1px solid var(--border); }
    .occ:last-child { border-bottom: none; }
    .back-btn { background: none; border: 1px solid var(--border); color: var(--text);
                padding: .4rem .75rem; border-radius: 6px; cursor: pointer;
                font-size: .8rem; margin-bottom: 1rem; }
    .back-btn:hover { border-color: var(--accent); }

    .empty { text-align: center; padding: 3rem; color: var(--muted); }
    .spinner { display: inline-block; width: 18px; height: 18px;
               border: 2px solid var(--border); border-top-color: var(--accent);
               border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>⚡ <span>FaultLine</span></h1>
    <div class="connect">
      <input id="api-url" placeholder="Paste your API Gateway URL (e.g. https://xxx.execute-api.…/prod)" />
      <button onclick="connect()">Connect</button>
    </div>
  </header>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="label">Error Groups</div><div class="value" id="stat-groups">0</div></div>
    <div class="stat"><div class="label">Total Events</div><div class="value" id="stat-events">0</div></div>
    <div class="stat"><div class="label">Latest</div><div class="value" id="stat-latest" style="font-size:1rem">—</div></div>
  </div>

  <main>
    <div id="list-view">
      <h2>Error Groups</h2>
      <div id="error-list" class="error-list">
        <div class="empty">Enter your API URL above and click <b>Connect</b> to load errors.</div>
      </div>
    </div>

    <div id="detail-view" style="display:none">
      <button class="back-btn" onclick="showList()">← Back to list</button>
      <div id="detail-content" class="detail-panel"></div>
    </div>
  </main>

  <script>
    let BASE = '';

    function connect() {
      BASE = document.getElementById('api-url').value.replace(/\/+$/, '');
      if (!BASE) return;
      localStorage.setItem('faultline_api', BASE);
      loadErrors();
    }

    // Restore saved URL on load.
    (() => {
      const saved = localStorage.getItem('faultline_api');
      if (saved) { document.getElementById('api-url').value = saved; BASE = saved; loadErrors(); }
    })();

    async function loadErrors() {
      const el = document.getElementById('error-list');
      el.innerHTML = '<div class="empty"><span class="spinner"></span> Loading…</div>';

      try {
        const res = await fetch(BASE + '/errors');
        const data = await res.json();
        const errors = data.errors || [];

        document.getElementById('stats').style.display = 'flex';
        document.getElementById('stat-groups').textContent = errors.length;
        document.getElementById('stat-events').textContent = errors.reduce((s, e) => s + (e.count || 0), 0);

        if (errors.length > 0) {
          const sorted = errors.sort((a, b) => (b.last_seen || '').localeCompare(a.last_seen || ''));
          document.getElementById('stat-latest').textContent = timeAgo(sorted[0].last_seen);
        }

        if (errors.length === 0) {
          el.innerHTML = '<div class="empty">No errors yet. Send one with:<br><code>curl -X POST $API/errors -d \'{"message":"test","source":"demo"}\'</code></div>';
          return;
        }

        el.innerHTML = errors
          .sort((a, b) => (b.last_seen || '').localeCompare(a.last_seen || ''))
          .map(e => {
            const cls = e.count >= 100 ? '' : e.count >= 10 ? 'warn' : 'low';
            return `<div class="error-card" onclick="showDetail('${e.group_id}')">
              <div class="error-count ${cls}">${e.count}×</div>
              <div class="error-info">
                <div class="error-msg">${esc(e.message)}</div>
                <div class="error-meta">
                  <span>📦 ${esc(e.source)}</span>
                  <span>🕐 ${timeAgo(e.last_seen)}</span>
                  <span>🏷️ ${esc(e.level || 'error')}</span>
                </div>
              </div>
            </div>`;
          }).join('');
      } catch (err) {
        el.innerHTML = `<div class="empty" style="color:var(--red)">Failed to connect: ${esc(err.message)}</div>`;
      }
    }

    async function showDetail(id) {
      document.getElementById('list-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      const el = document.getElementById('detail-content');
      el.innerHTML = '<span class="spinner"></span> Loading…';

      try {
        const res = await fetch(BASE + '/errors/' + id);
        const data = await res.json();
        const g = data.group;
        const occs = data.occurrences || [];

        el.innerHTML = `
          <h3>${esc(g.message)}</h3>
          <div class="field"><span class="k">Group ID</span> <code>${g.group_id}</code></div>
          <div class="field"><span class="k">Source</span> ${esc(g.source)}</div>
          <div class="field"><span class="k">Level</span> ${esc(g.level)}</div>
          <div class="field"><span class="k">Count</span> <b>${g.count}</b></div>
          <div class="field"><span class="k">First seen</span> ${g.first_seen}</div>
          <div class="field"><span class="k">Last seen</span> ${g.last_seen}</div>
          <div class="field"><span class="k">Status</span> ${g.status}</div>
          <div class="occ-list">
            <h3>Recent Occurrences (${occs.length})</h3>
            ${occs.map(o => `<div class="occ">
              <b>${o.timestamp}</b> &nbsp; ${esc(o.stacktrace || '—')}
              ${o.metadata ? '<br><span style="color:var(--muted)">' + esc(JSON.stringify(o.metadata)) + '</span>' : ''}
            </div>`).join('')}
          </div>`;
      } catch (err) {
        el.innerHTML = `<div style="color:var(--red)">Error: ${esc(err.message)}</div>`;
      }
    }

    function showList() {
      document.getElementById('list-view').style.display = 'block';
      document.getElementById('detail-view').style.display = 'none';
    }

    function timeAgo(iso) {
      if (!iso) return '—';
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60)   return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    function esc(s) {
      const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
    }
  </script>
</body>
</html>
